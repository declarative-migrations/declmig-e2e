name: Declarative migrations promotion evidence

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: declmig-e2e-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out promotion harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - name: Compile evidence verifier
        run: python3 -m compileall -q scripts tests

      - name: Test fail-closed evidence verification
        run: python3 -m unittest discover -s tests -v

      - name: Validate evidence-only repository contract
        run: python3 scripts/validate_repository_config.py

      - name: Upload contract evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: declmig-promotion-contract-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/config-validation.json
          if-no-files-found: error
          retention-days: 14

  test-evidence:
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DECLMIG_EVIDENCE_MODE: ${{ github.event_name == 'pull_request' && 'candidate' || 'release' }}
    steps:
      - name: Check out promotion harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - name: Verify exact independent jobs, source pin, and artifact digests
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/verify_test_evidence.py
          --manifest pins/test-evidence.json
          --mode "$DECLMIG_EVIDENCE_MODE"

      - name: Upload promotion evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: declmig-independent-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/test-evidence-verification.json
          if-no-files-found: error
          retention-days: 14
